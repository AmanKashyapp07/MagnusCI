apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: magnus-ci-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "magnus-api"
spec:
  tls:
    - hosts:
        - magnus-ci.online
      secretName: magnus-ci-tls
  rules:
    - host: magnus-ci.online
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: magnus-api
                port:
                  number: 5001
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: magnus-api
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: magnus-frontend
                port:
                  number: 80
